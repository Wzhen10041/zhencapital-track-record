name: Intraday refresh
on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intraday
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 live_update.py
      - run: |
          git config user.name "zhen-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Intraday refresh"
          git pull --rebase && git push
